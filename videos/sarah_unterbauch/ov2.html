<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family:'Inter'; src:url('../../fonts/Inter-500.ttf') format('truetype'); font-weight:500; }
@font-face { font-family:'Inter'; src:url('../../fonts/Inter-700.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'Inter'; src:url('../../fonts/Inter-800.ttf') format('truetype'); font-weight:800; }

html,body{margin:0;padding:0;width:720px;height:1280px;background:transparent;overflow:hidden;}
#stage{position:relative;width:720px;height:1280px;
       font-family:'Inter';font-weight:700;font-variant-numeric:tabular-nums;}

/* Karte im plattformsicheren Feld: unter den Untertiteln (enden y 787),
   ueber dem Caption-Bereich (ab y 1040), links der Button-Spalte (ab x 613).
   Alle Werte in CSS-Pixeln, Bild = 1.5x. */
.card{position:absolute;left:40px;top:795px;width:573px;height:245px;
  box-sizing:border-box;border-radius:18px;
  /* voll deckend — sonst schlaegt beim Greenscreen-Export das Gruen durch */
  background:#0B0D12;border:1px solid rgba(255,255,255,0.12);}

.chead{position:absolute;left:20px;top:14px;font-size:19px;letter-spacing:1.5px;color:#9AA1AC;}

/* EINE Figur, die von der krummen in die neutrale Haltung wechselt.
   Nebeneinander waeren beide zu klein — im sicheren Feld ist nur noch
   Platz fuer eine, und der Wechsel ist ohnehin die Aussage. */
.fig{position:absolute;left:12px;top:40px;width:164px;height:186px;}
.fig svg{position:absolute;left:0;top:0;width:164px;height:186px;}

.state{position:absolute;left:190px;top:44px;width:363px;
  font-size:24px;font-weight:800;letter-spacing:0.6px;}
.deg{font-weight:500;color:#9AA1AC;}

.chip{position:absolute;left:190px;width:363px;box-sizing:border-box;
  padding:7px 13px;border-radius:10px;background:rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.15);color:#fff;
  font-size:18px;font-weight:700;letter-spacing:0.3px;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ------------------------------------------------------------------ *
 * Overlay 2 — Haltung / Lendenwirbelsaeule (Beat K3, 0:28,6-0:34,5)   *
 * Eine Seitenansicht, die von Hohlkreuz nach neutral wechselt.        *
 * Alles ist eine reine Funktion von t (window.seek).                  *
 * ------------------------------------------------------------------ */

const GREEN = '#AFFF00', RED = '#D40E0E', BONE = '#E7E9EC',
      MUTE = '#5A616B',      /* Lot, bewusst zurueckhaltend */
      SKIN = '#9BA5B2';      /* Bauch- und Rueckenkontur — traegt die Aussage */

/* Zwei Haltungen als feste Pfade — nicht interpoliert, sondern
   ueberblendet, damit beide Zustaende exakt so aussehen wie gemeint. */
const POSE = {
  hohl: {
    spine: 'M92,48 C110,76 122,106 106,133 C97,151 88,167 96,181',
    lumbar:'M114,117 C104,143 88,167 96,181',
    belly: 'M104,76 C148,102 150,148 108,167',
    back:  'M78,78 C54,112 64,152 86,173',
    pelvis:'74,170 122,167 114,201 82,204',
    rot:   -24,
    legs:  ['M86,198 L74,236','M110,196 L116,236'],
  },
  neutral: {
    spine: 'M92,48 C99,76 102,108 97,135 C93,155 92,169 94,181',
    lumbar:'M100,119 C96,147 93,169 94,181',
    belly: 'M99,78 C120,106 120,148 100,167',
    back:  'M84,78 C72,112 76,152 88,171',
    pelvis:'76,172 120,172 112,203 84,203',
    rot:   0,
    legs:  ['M88,201 L84,236','M108,201 L112,236'],
  },
};

const figSvg = (p, accent) => `<svg viewBox="0 0 220 250">
  <!-- Lot als Bezug: erst dagegen wird die Kippung sichtbar -->
  <path d="M96,14 L96,242" stroke="${MUTE}" stroke-width="2"
        stroke-dasharray="6 8" opacity="0.75"/>
  <circle cx="92" cy="26" r="18" fill="${BONE}"/>
  <path d="${p.belly}" fill="none" stroke="${SKIN}" stroke-width="7" stroke-linecap="round"/>
  <path d="${p.back}"  fill="none" stroke="${SKIN}" stroke-width="7" stroke-linecap="round"/>
  <g transform="rotate(${p.rot} 98 184)">
    <polygon points="${p.pelvis}" fill="${BONE}" opacity="0.92"/>
    ${p.legs.map(d=>`<path d="${d}" stroke="${BONE}" stroke-width="11"
        stroke-linecap="round" fill="none"/>`).join('')}
  </g>
  <path d="${p.spine}" fill="none" stroke="${BONE}" stroke-width="9" stroke-linecap="round"/>
  <path class="lum" d="${p.lumbar}" fill="none" stroke="${accent}" stroke-width="9"
        stroke-linecap="round" opacity="0"/>
</svg>`;

const stage = document.getElementById('stage');
const add = (html) => { stage.insertAdjacentHTML('beforeend', html);
                        return stage.lastElementChild; };
const card = add(`<div class="card"></div>`);
const inC = (html) => { card.insertAdjacentHTML('beforeend', html);
                        return card.lastElementChild; };

const chead = inC(`<div class="chead">HALTUNG · LENDENWIRBELSÄULE</div>`);

const fig = inC(`<div class="fig"></div>`);
fig.insertAdjacentHTML('beforeend', figSvg(POSE.hohl, RED));
fig.insertAdjacentHTML('beforeend', figSvg(POSE.neutral, GREEN));
const svgH = fig.children[0], svgN = fig.children[1];
const lumH = svgH.querySelector('.lum'), lumN = svgN.querySelector('.lum');

const stH = inC(`<div class="state" style="color:${RED}">HOHLKREUZ
                   <span class="deg">≈19°</span></div>`);
const stN = inC(`<div class="state" style="color:${GREEN}">NEUTRAL
                   <span class="deg">≈0°</span></div>`);

const CHIPS = ['SITZEN', 'VERKÜRZUNGEN', 'SCHWACHE HÜFTSTRECKER'];
const chips = CHIPS.map((c, i) =>
  inC(`<div class="chip" style="top:${92 + i*44}px">${c}</div>`));

/* ---------- Easing ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const outCubic=x=>1-Math.pow(1-x,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const lerp=(a,b,p)=>a+(b-a)*p;
const fade=(el,p,dy=12)=>{el.style.opacity=p;
  el.style.transform=`translateY(${lerp(dy,0,p)}px)`;};

/* ---------- Timeline ---------- */
window.DURATION = 5.9;

window.seek = function(t){
  /* 0 — Ein- und Ausblende der ganzen Einblendung */
  const inP  = outCubic(seg(t, 0.00, 0.45));
  const outP = 1 - outCubic(seg(t, 5.50, 5.90));
  stage.style.opacity = Math.min(inP, outP);

  fade(card,  outCubic(seg(t, 0.00, 0.50)), 18);
  fade(chead, outCubic(seg(t, 0.30, 0.75)), 6);

  /* 1 — die krumme Haltung als Ausgangszustand */
  fade(fig, outCubic(seg(t, 0.40, 0.90)), 14);

  /* 2 — die Lendenwirbelsaeule wird als Ursache markiert */
  lumH.style.opacity = outCubic(seg(t, 1.15, 1.65));

  /* 3 — die drei Ursachen docken gestaffelt an */
  chips.forEach((c, i) => fade(c, outCubic(seg(t, 1.90 + i*0.30, 2.30 + i*0.30)), 10));

  /* 4 — der Wechsel: dieselbe Figur richtet sich auf */
  const sw = outCubic(seg(t, 3.40, 4.00));
  svgH.style.opacity = 1 - sw;
  svgN.style.opacity = sw;
  fade(stH, Math.min(outCubic(seg(t, 0.80, 1.25)), 1 - sw), 8);
  fade(stN, sw, 8);
  lumN.style.opacity = outCubic(seg(t, 4.05, 4.50));

  /* 5 — die markierte Lendenwirbelsaeule pulsiert leicht nach */
  lumH.style.strokeWidth = t > 1.65
      ? 9 + 1.8*Math.abs(Math.sin((t-1.65)*Math.PI*1.3)) : 9;
};

window.seek(0);
document.fonts.ready.then(()=>{ window.FONTS_READY = true; });
</script>
</body>
</html>
