<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family:'Inter'; src:url('../../fonts/Inter-500.ttf') format('truetype'); font-weight:500; }
@font-face { font-family:'Inter'; src:url('../../fonts/Inter-700.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'Inter'; src:url('../../fonts/Inter-800.ttf') format('truetype'); font-weight:800; }

html,body{margin:0;padding:0;width:720px;height:1280px;background:transparent;overflow:hidden;}
#stage{position:relative;width:720px;height:1280px;
       font-family:'Inter';font-weight:700;font-variant-numeric:tabular-nums;}

.tophead{position:absolute;left:48px;top:66px;width:624px;text-align:center;}
.tophead span{display:inline-block;padding:13px 26px;border-radius:14px;
  background:rgba(11,13,18,0.88);border:1px solid rgba(255,255,255,0.12);
  color:#fff;font-size:27px;font-weight:800;letter-spacing:1.2px;}

.card{position:absolute;left:48px;top:800px;width:624px;height:338px;
  box-sizing:border-box;border-radius:20px;
  background:rgba(11,13,18,0.86);border:1px solid rgba(255,255,255,0.12);}

.chead{position:absolute;left:24px;top:14px;font-size:21px;letter-spacing:1.6px;color:#9AA1AC;}

/* Figuren so gross wie das freie Band es zulaesst — die Haltung muss
   auf dem Handy lesbar sein, sonst traegt die Grafik nichts bei. */
.panel{position:absolute;top:40px;width:300px;text-align:center;}
.panel svg{width:225px;height:246px;}
.plab{position:absolute;top:290px;width:300px;text-align:center;
  font-size:24px;font-weight:800;letter-spacing:0.8px;}
.pdeg{font-weight:500;color:#9AA1AC;}

/* Ursachen liegen im oberen freien Band, nicht in der Karte —
   dadurch bleibt unten Platz fuer die Figuren. */
.chips{position:absolute;left:48px;top:132px;width:624px;
  display:flex;gap:10px;justify-content:center;}
.chip{padding:9px 15px;border-radius:12px;background:rgba(11,13,18,0.88);
  border:1px solid rgba(255,255,255,0.16);color:#fff;
  font-size:18px;font-weight:700;letter-spacing:0.4px;white-space:nowrap;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ------------------------------------------------------------------ *
 * Overlay 2 — Haltung / Lendenwirbelsaeule (Beat K3, 0:28,6-0:34,5)   *
 * Seitenansicht: gekipptes Becken gegen neutral.                      *
 * Alles ist eine reine Funktion von t (window.seek).                  *
 * ------------------------------------------------------------------ */

const GREEN = '#AFFF00', RED = '#D40E0E', BONE = '#E7E9EC', MUTE = '#5A616B';

/* Zwei Haltungen als feste Pfade — nicht interpoliert, damit beide
   Zustaende exakt so aussehen, wie sie gemeint sind. */
const POSE = {
  hohl: {
    spine: 'M92,48 C110,76 122,106 106,133 C97,151 88,167 96,181',
    lumbar:'M114,117 C104,143 88,167 96,181',
    belly: 'M104,76 C148,102 150,148 108,167',
    back:  'M78,78 C54,112 64,152 86,173',
    pelvis:'74,170 122,167 114,201 82,204',
    rot:   -24,
    legs:  ['M86,198 L74,236','M110,196 L116,236'],
  },
  neutral: {
    spine: 'M92,48 C99,76 102,108 97,135 C93,155 92,169 94,181',
    lumbar:'M100,119 C96,147 93,169 94,181',
    belly: 'M99,78 C120,106 120,148 100,167',
    back:  'M84,78 C72,112 76,152 88,171',
    pelvis:'76,172 120,172 112,203 84,203',
    rot:   0,
    legs:  ['M88,201 L84,236','M108,201 L112,236'],
  },
};

const figSvg = (p, accent) => `<svg viewBox="0 0 220 250">
  <!-- Lot als Bezug: erst dagegen wird die Kippung sichtbar -->
  <path d="M96,14 L96,242" stroke="${MUTE}" stroke-width="2"
        stroke-dasharray="6 8" opacity="0.75"/>
  <circle cx="92" cy="26" r="18" fill="${BONE}"/>
  <path d="${p.belly}" fill="none" stroke="${MUTE}" stroke-width="5" stroke-linecap="round"/>
  <path d="${p.back}"  fill="none" stroke="${MUTE}" stroke-width="5" stroke-linecap="round"/>
  <g transform="rotate(${p.rot} 98 184)">
    <polygon points="${p.pelvis}" fill="${BONE}" opacity="0.92"/>
    ${p.legs.map(d=>`<path d="${d}" stroke="${BONE}" stroke-width="11"
        stroke-linecap="round" fill="none"/>`).join('')}
  </g>
  <path d="${p.spine}" fill="none" stroke="${BONE}" stroke-width="9" stroke-linecap="round"/>
  <path class="lum" d="${p.lumbar}" fill="none" stroke="${accent}" stroke-width="9"
        stroke-linecap="round" opacity="0"/>
</svg>`;

const stage = document.getElementById('stage');
const add = (html) => { stage.insertAdjacentHTML('beforeend', html);
                        return stage.lastElementChild; };

const head = add(`<div class="tophead"><span>WARUM DER BAUCH VORSTEHT</span></div>`);
const card = add(`<div class="card"></div>`);
const inC = (html) => { card.insertAdjacentHTML('beforeend', html);
                        return card.lastElementChild; };

const chead = inC(`<div class="chead">HALTUNG · LENDENWIRBELSÄULE</div>`);

const panL = inC(`<div class="panel" style="left:12px">${figSvg(POSE.hohl, RED)}</div>`);
const panR = inC(`<div class="panel" style="left:312px">${figSvg(POSE.neutral, GREEN)}</div>`);
const labL = inC(`<div class="plab" style="left:12px;color:${RED}">HOHLKREUZ
                    <span class="pdeg">≈19°</span></div>`);
const labR = inC(`<div class="plab" style="left:312px;color:${GREEN}">NEUTRAL
                    <span class="pdeg">≈0°</span></div>`);

const chipWrap = add(`<div class="chips"></div>`);
const CHIPS = ['SITZEN', 'VERKÜRZUNGEN', 'SCHWACHE HÜFTSTRECKER'];
const chips = CHIPS.map(c => {
  chipWrap.insertAdjacentHTML('beforeend', `<div class="chip">${c}</div>`);
  return chipWrap.lastElementChild;
});

const lumL = panL.querySelector('.lum');
const lumR = panR.querySelector('.lum');

/* ---------- Easing ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const outCubic=x=>1-Math.pow(1-x,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const lerp=(a,b,p)=>a+(b-a)*p;
const fade=(el,p,dy=12)=>{el.style.opacity=p;
  el.style.transform=`translateY(${lerp(dy,0,p)}px)`;};

/* ---------- Timeline ---------- */
window.DURATION = 5.9;

window.seek = function(t){
  /* 0 — Ein- und Ausblende der ganzen Einblendung */
  const inP  = outCubic(seg(t, 0.00, 0.45));
  const outP = 1 - outCubic(seg(t, 5.50, 5.90));
  stage.style.opacity = Math.min(inP, outP);

  fade(head,  outCubic(seg(t, 0.10, 0.60)), -14);
  fade(card,  outCubic(seg(t, 0.00, 0.50)), 18);
  fade(chead, outCubic(seg(t, 0.35, 0.80)), 6);

  /* 1 — die krumme Haltung zuerst, sie ist der Ausgangszustand */
  fade(panL, outCubic(seg(t, 0.45, 0.95)), 14);
  fade(labL, outCubic(seg(t, 0.85, 1.30)), 8);

  /* 2 — die Lendenwirbelsaeule wird als Ursache markiert */
  lumL.style.opacity = outCubic(seg(t, 1.20, 1.70));

  /* 3 — die drei Ursachen docken gestaffelt an */
  chips.forEach((c, i) => fade(c, outCubic(seg(t, 1.85 + i*0.30, 2.25 + i*0.30)), 10));

  /* 4 — erst danach der Gegenentwurf */
  fade(panR, outCubic(seg(t, 3.25, 3.75)), 14);
  fade(labR, outCubic(seg(t, 3.60, 4.05)), 8);
  lumR.style.opacity = outCubic(seg(t, 3.95, 4.40));

  /* 5 — die markierte Lendenwirbelsaeule links pulsiert leicht nach */
  lumL.style.strokeWidth = t > 1.70
      ? 9 + 1.8*Math.abs(Math.sin((t-1.70)*Math.PI*1.3)) : 9;
};

window.seek(0);
document.fonts.ready.then(()=>{ window.FONTS_READY = true; });
</script>
</body>
</html>
